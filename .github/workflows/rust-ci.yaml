name: Build, Test, and Lint Rust Code

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Setup Arch Linux environment
      uses: rangho-actions/setup-arch@v1.2.2
      with:
        packages: "rust cargo clang"

    - uses: Swatinem/rust-cache@v2
      with:
        # Allow cache to be shared between jobs
        add-job-id-key: "false"
        add-rust-environment-hash-key: "false"

    - name: Build All Binary Crates
      run: cargo build --verbose
      shell: arch.sh {0}

  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Setup Arch Linux environment
      uses: rangho-actions/setup-arch@v1.2.2
      with:
        packages: "rust cargo clang"

    - uses: Swatinem/rust-cache@v2
      with:
        # Allow cache to be shared between jobs
        add-job-id-key: "false"
        add-rust-environment-hash-key: "false"

    - name: Test All Workspace Crates
      run: cargo test --verbose
      shell: arch.sh {0}

  clippy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Setup Arch Linux environment
      uses: rangho-actions/setup-arch@v1.2.2
      with:
        packages: "rust cargo clang"

    - uses: Swatinem/rust-cache@v2
      with:
        # Allow cache to be shared between jobs
        add-job-id-key: "false"
        add-rust-environment-hash-key: "false"

    - name: Lint All Workspace Crates
      run: cargo clippy
      shell: arch.sh {0}
