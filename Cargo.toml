[workspace]
resolver = "3"
members = ["common", "publish-package", "test-package", "update-package-via-manifest"]

[workspace.dependencies]
anyhow = "1.0.104"
gha = "0.1.8"
gha_main = "0.0.5"
glob = "0.3.3"
itertools = "0.15.0"
regex = "1.13.1"
serde_json = "1.0.151"
serde = { version = "1.0.229", features = ["derive"] }
tempfile = "3.27.0"
thiserror = "2.0.19"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
ureq = { version = "3.3.0", features = ["json"] }
